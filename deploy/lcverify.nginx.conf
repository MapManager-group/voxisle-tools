# Include inside the tools.voxisle.art server block; root must point to dist.
location = /lcverify {
    try_files /index.html =404;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /lcverify/ {
    try_files /index.html =404;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /api/lcverify {
    if ($request_method != POST) { return 405; }
    proxy_pass https://hanamizu.feishu.cn/base/workflow/webhook/event/DJvLazywFwPCathZb3scjT4mnp3;
    proxy_ssl_server_name on;
    proxy_set_header Host hanamizu.feishu.cn;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Content-Type application/json;
    add_header Cache-Control "no-store" always;
}
